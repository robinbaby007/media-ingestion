spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Allows the gateway to discover services from Eureka
#          lower-case-service-id: true # Lets you use lowercase names in auto-generated routes
      routes:
        # Route for the event_api_service
        - id: event_api_service
          uri: lb://EVENT_API_SERVICE
          predicates:
            - Path=/api/events, /api/events/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
