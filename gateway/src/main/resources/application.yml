spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Allows the gateway to discover services from Eureka
#          lower-case-service-id: true # Lets you use lowercase names in auto-generated routes

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true

jwt:
  secret: thisIsASecretKeyForJWTGenerationAndIsNotTooShortAndNotTooLongEitherAndShouldBeKeptSafeAndSecure