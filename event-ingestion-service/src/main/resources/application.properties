spring.application.name=event-ingestion-service


server.port=9991


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=media-event-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Event api sends its own MediaEventRequest(com.mi.event_api_service.model) to kafka.
# Event injestion use its own MediaEventRequest(com.mi.event_ingestion_service.models). Below config fix the issues

spring.kafka.consumer.properties.spring.json.value.default.type=com.mi.event_ingestion_service.models.MediaEventRequest
spring.kafka.consumer.properties.spring.json.use.type.headers=false